# Automatisches Deployment bei Push ist derzeit deaktiviert - nur manuell über "Run workflow" startbar.
on:
  workflow_dispatch:
name: 🚀 Deploy website
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v2
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@4.1.0
      with:
        server: REDACTED
        username: REDACTED
        password: ${{ secrets.REDACTED_netcup }}
        server-dir: /var/www/html/blankiball/Turnierwebsite/tourna/
